# GitHub Actions / Gitee Go — 后端测试 CI
# 触发:push 到 master、PR 目标 master、手动触发
# 镜像兼容:Gitee Go Actions 用同一份 yml
name: backend-test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # lockfile 的 resolved 已全部指向 registry.npmjs.org，npm ci 可直接跑通。
      # （曾锁在 registry.npmmirror.com，镜像不可达处 npm ci 一律 403 失败，
      #   只能靠 || npm install 兜底，每次先白跑一轮。）
      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        env:
          # CI 环境无 MongoDB / Redis / LightRAG / OpenAI,所有依赖走 mock + in-memory 兜底
          NODE_ENV: test
          JWT_SECRET: ci-test-secret
          REDIS_URL: ''
          LIGHTRAG_URL: ''
          OPENAI_API_KEY: ''
          SENTRY_DSN: ''
          RATE_LIMIT_DISABLED: '1'
        run: npm test

      # preflight 自身也要被测：它是上线前的最后一道闸，
      # 闸门本身坏了（比如挂死、误判）比没有闸门更危险。
      # 这里不检查"某份配置是否合格"（CI 没有真实密钥），
      # 而是验证脚本的判定逻辑：好配置放行、坏配置拦下、且都能正常退出。
      - name: Preflight - 合格配置应放行
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-preflight-secret-long-enough-to-pass-32-chars
          ALLOWED_ORIGINS: https://example.com
          WX_APPID: wxci0000000000000
          WX_SECRET: ci-wx-secret
          OPENAI_API_KEY: sk-ci-placeholder
        run: npm run preflight -- --skip-net

      - name: Preflight - 弱密钥必须被拦下
        working-directory: backend
        env:
          NODE_ENV: production
          JWT_SECRET: too-short
          ALLOWED_ORIGINS: https://example.com
        run: |
          if npm run preflight -- --skip-net; then
            echo "::error::preflight 放行了过弱的 JWT_SECRET，闸门失效"
            exit 1
          fi
          echo "已正确拦下弱密钥"

      - name: Preflight - 生产环境的通配 CORS 必须被拦下
        working-directory: backend
        env:
          NODE_ENV: production
          JWT_SECRET: ci-preflight-secret-long-enough-to-pass-32-chars
          ALLOWED_ORIGINS: '*'
          WX_APPID: wxci0000000000000
          WX_SECRET: ci-wx-secret
          WXPAY_API_KEY: ci-pay-key
        run: |
          if npm run preflight -- --skip-net; then
            echo "::error::preflight 放行了 prod 下的 ALLOWED_ORIGINS=*，闸门失效"
            exit 1
          fi
          echo "已正确拦下通配 CORS"

      # 覆盖率可选,跑通再加 codecov
      # - name: Coverage
      #   working-directory: backend
      #   run: npm test -- --coverage